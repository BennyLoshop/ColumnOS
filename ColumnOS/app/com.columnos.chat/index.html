<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ColumnOS Chat</title>
    <link rel="stylesheet" vfs:href="/css/style.css">
</head>
<body>
    <div id="app">
        <!-- 左侧联系人列表 -->
        <div class="sidebar">
            <h2>联系人</h2>
            <ul id="contacts"></ul>
            <div class="new-contact">
                <input type="text" id="new-username" placeholder="用户名">
                <input type="text" id="new-apihost" placeholder="API Host" value="http://sxz.api.zykj.org">
                <input type="password" id="new-password" placeholder="密码">
                <button id="add-contact">添加联系人</button>
            </div>
        </div>

        <!-- 右侧聊天窗口 -->
        <div class="chat">
            <h2 id="chat-title">选择联系人</h2>
            <div id="messages" class="messages"></div>
            <div class="send-box">
                <input type="text" id="message-input" placeholder="输入消息...">
                <button id="send-message">发送</button>
            </div>
        </div>
    </div>
    <script vfs:src="/js/app.js"></script>
</body>
</html>
