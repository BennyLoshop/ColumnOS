<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统更新</title>
    <link rel="stylesheet" vfs:href="/style.css">
</head>

<body>
    <div id="app">
        <img id="update-img" vfs:src="/update.png" alt="更新" />
        <div id="update-subtitle">等待系统初始化...</div>
        <div id="progress-bar">
            <div id="progress-fill"></div>
        </div>
    </div>

    <!-- 自定义 confirm 弹窗 -->
    <div id="confirm-modal" class="modal">
        <div class="modal-content">
            <p id="confirm-msg"></p>
            <div class="modal-buttons">
                <button id="confirm-yes">下载</button>
                <button id="confirm-no">取消</button>
            </div>
        </div>
    </div>

    <div id="toast"></div>


    <script vfs:src="/update.js"></script>
</body>

</html>
