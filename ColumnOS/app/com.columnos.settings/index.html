<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>WebSocket 测试</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        #status { font-weight: bold; }
    </style>
</head>
<body>
    <h1>WebSocket 连接测试</h1>
    <p>目标地址: <code>ws://115.29.169.60:6789</code></p>
    <p>连接状态: <span id="status">未连接</span></p>
    <button id="checkBtn">测试连接</button>

    <script>
        const statusEl = document.getElementById("status");
        const btn = document.getElementById("checkBtn");

        btn.addEventListener("click", () => {
            statusEl.textContent = "正在连接...";
            
            try {
                const ws = new WebSocket("ws://loshop.com.cn:8766");

                ws.onopen = () => {
                    statusEl.textContent = "✅ 连接成功";
                    ws.close();
                };

                ws.onerror = (err) => {
                    console.error("WebSocket 错误:", err);
                    statusEl.textContent = "❌ 连接失败";
                };

                ws.onclose = (event) => {
                    if (statusEl.textContent !== "✅ 连接成功") {
                        statusEl.textContent = "❌ 已关闭 / 无法连接";
                    }
                };
            } catch (e) {
                console.error("异常:", e);
                statusEl.textContent = "❌ 异常错误";
            }
        });
    </script>
</body>
</html>
