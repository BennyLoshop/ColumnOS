<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视频播放器</title>
    <link rel="stylesheet" href="style.css" vfs:href="/style.css">
    <!-- DPlayer 样式 -->
    <link rel="stylesheet" href="DPlayer.min.css" vfs:href="/DPlayer.min.css">
</head>
<body>
    <!-- 顶部导航栏 -->
    <div id="navBar">
        <div id="videoName">未加载视频</div>
        <div class="controls">
            <button id="loadBtn">加载视频</button>
        </div>
    </div>

    <!-- 视频容器 -->
    <div id="playerContainer"></div>

    <!-- 模态选择文件 -->
    <input type="file" id="videoFileInput" accept="video/*" style="display:none">

    <!-- DPlayer -->
    <script src="DPlayer.min.js" vfs:src="/DPlayer.min.js"></script>
    <script src="script.js" vfs:src="/script.js"></script>
</body>
</html>
