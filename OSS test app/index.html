<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OSS 文件上传</title>
  <style>
    body { background:#1e1e1e; color:#ddd; font-family:sans-serif; padding:20px; }
    input,button { width:100%; padding:10px; margin:8px 0; border-radius:8px; border:1px solid #555; background:#222; color:#fff; }
    button { cursor:pointer; background:#3a3a3a; }
    .file-list { border:1px solid #555; padding:10px; border-radius:8px; max-height:200px; overflow-y:auto; }
    .file-item { display:flex; justify-content:space-between; background:#222; padding:6px; border-radius:6px; margin-bottom:6px; }
    .file-progress { height:6px; background:#4caf50; width:0%; border-radius:4px; margin-top:4px; }
    iframe { width:100%; height:300px; border:1px solid #444; margin-top:20px; }
  </style>
  <script vfs:src="/crypto-js.min.js"></script>
  <script vfs:src="/aliyun-oss-sdk-6.16.0.min.js"></script>
</head>
<body>
  <h2>OSS 文件上传</h2>

  <div>
    API Host:<input id="apiHost" placeholder="http://xx" />
    用户名:<input id="username" />
    密码:<input id="password" type="password" />
  </div>

  <button id="addFileBtn">选择文件</button>
  <input type="file" id="hiddenFile" style="display:none;" multiple />

  <div class="file-list" id="fileList"></div>
  <button id="btnUploadAll">上传全部</button>

  <h3>URL 预览</h3>
  <input id="previewUrl" placeholder="输入 OSS url" />
  <button id="btnPreview">加载</button>
  <iframe id="previewFrame"></iframe>

  <script>
(async () => {
  function waitVapp() {
    return new Promise(resolve => {
      if (window.vapp) return resolve(window.vapp);
      const timer = setInterval(() => {
        if (window.vapp) {
          clearInterval(timer);
          resolve(window.vapp);
        }
      }, 100);
    });
  }
  await waitVapp();

  let fileItems = [];
  window.fileItems = fileItems;

  const hiddenFile = document.getElementById('hiddenFile');
  const fileList = document.getElementById('fileList');

  document.getElementById('addFileBtn').onclick = ()=> hiddenFile.click();

  hiddenFile.onchange = ()=>{
    for(const f of hiddenFile.files){ fileItems.push(f); }
    render();
  };

  function render(){
    fileList.innerHTML = '';
    fileItems.forEach(f=>{
      const div=document.createElement('div');
      div.className='file-item';

      const name=document.createElement('div');
      name.innerText=f.name;

      const pg=document.createElement('div');
      pg.className='file-progress';
      f._bar=pg;

      const del=document.createElement('button');
      del.innerText='删除';
      del.onclick=()=>{ fileItems = fileItems.filter(x=>x!==f); window.fileItems=fileItems; render(); };

      div.appendChild(name);
      div.appendChild(pg);
      div.appendChild(del);
      fileList.appendChild(div);
    });
  }

  async function uploadSingle(file, userId, ossToken){
    const client=new OSS({
      region:"oss-cn-hangzhou",
      accessKeyId:ossToken.accessKeyId,
      accessKeySecret:ossToken.accessKeySecret,
      stsToken:ossToken.securityToken,
      bucket:ossToken.bucket
    });

    const dateStr=new Date().toISOString().slice(0,10).replace(/-/g,'');
    const nonce=Math.random().toString(36).slice(2);
    const remote=`note_v2/res/${userId}/${dateStr}/${nonce}/${file.name}`;

    await client.put(remote, file, {
      progress:(p)=>{ file._bar.style.width=(p*100)+"%"; }
    });

    file._ossUrl=`https://${ossToken.bucket}.oss-cn-hangzhou.aliyuncs.com/${remote}`;
  }

  async function uploadAll(){
    const apiHost=document.getElementById('apiHost').value.trim();
    const username=document.getElementById('username').value.trim();
    const password=document.getElementById('password').value.trim();

    if(!apiHost||!username||!password){ alert('缺少信息'); return; }

    const login=await fetch(apiHost+"/api/TokenAuth/Login",{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({userName:username,password:password})
    }).then(r=>r.json());
    if(!login.success){ alert('登录失败'); return; }
    const token=login.result.accessToken;

    const user=await fetch(apiHost+"/api/services/app/User/GetInfoAsync",{
      headers:{Authorization:`Bearer ${token}`}
    }).then(r=>r.json());
    const userId=String(user.result.id);

    const fc="note_v2", fr="res", ft=2, fe="", fo="0";
    const nonce=Math.random().toString(36).slice(2);
    const ts=Date.now();
    const raw=`${userId}+${fc}+${fr}+${ft}+${fe}+${fo}+${nonce}+${ts}`;
    const sign=CryptoJS.MD5(raw).toString().toUpperCase();

    const ossToken=await fetch(apiHost+"/api/services/app/ObjectStorage/GenerateTokenV2Async",{
      method:"POST", headers:{"Content-Type":"application/json", Authorization:`Bearer ${token}`},
      body:JSON.stringify({ fc, fr, ft, fe, fo, nonce, ts, sign })
    }).then(r=>r.json()).then(r=>r.result);

    for(const f of fileItems){ await uploadSingle(f, userId, ossToken); }

    alert("全部上传完成");
  }

  document.getElementById('btnUploadAll').onclick=uploadAll;
  document.getElementById('btnPreview').onclick=()=>{
    document.getElementById('previewFrame').src=document.getElementById('previewUrl').value.trim();
  };
})();
  </script>
</body>
</html>
