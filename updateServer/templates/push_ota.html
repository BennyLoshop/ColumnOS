<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>OTA 推送</title>
    <style>
        body {
            font-family: sans-serif;
            background: #1e1e1e;
            color: #ddd;
            margin: 0;
            padding: 0;
        }

        h2 {
            color: #4285f4;
        }

        .container {
            padding: 20px;
            max-width: 800px;
            margin: auto;
        }

        input,
        select,
        button {
            padding: 6px;
            margin: 2px;
            border-radius: 4px;
            border: none;
        }

        button {
            background: #4285f4;
            color: #fff;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        select {
            width: 100%;
            height: 100px;
        }

        #log {
            margin-top: 10px;
        }

        .info {
            color: #ffcc00;
        }

        .success {
            color: #4caf50;
        }

        .error {
            color: #f44336;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>发布 OTA 更新</h2>
        <form id="ota-form" enctype="multipart/form-data">
            <input type="file" name="file" id="ota-file" required>
            <select id="alias-select" multiple></select>
            <button type="submit" id="submit-btn">推送 OTA</button>
        </form>
        <div id="log"></div>
    </div>

    <script>
        const logEl = document.getElementById('log');
        const submitBtn = document.getElementById('submit-btn');

        function log(msg, type = 'info') {
            const div = document.createElement('div');
            div.textContent = msg;
            div.className = type;
            logEl.appendChild(div);
            logEl.scrollTop = logEl.scrollHeight;
        }

        async function loadAliases() {
            try {
                const resp = await fetch('/users');
                const data = await resp.json();
                const select = document.getElementById('alias-select');
                select.innerHTML = "";
                data.forEach(u => {
                    const opt = document.createElement('option');
                    opt.value = u.alias;
                    opt.textContent = u.alias;
                    select.appendChild(opt);
                });
            } catch (err) {
                log('加载 alias 失败: ' + err.message, 'error');
            }
        }

        document.getElementById('ota-form').onsubmit = async e => {
            e.preventDefault();
            const fileInput = document.getElementById('ota-file');
            const select = document.getElementById('alias-select');
            const aliases = Array.from(select.selectedOptions).map(o => o.value);

            if (!fileInput.files[0]) {
                log('请选择文件', 'error');
                return;
            }
            if (aliases.length === 0) {
                log('请选择至少一个 alias', 'error');
                return;
            }

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            aliases.forEach(a => formData.append('alias', a));

            // 显示推送中，并禁用按钮
            submitBtn.disabled = true;
            submitBtn.textContent = '推送中...';
            log('正在推送 OTA...', 'info');

            try {
                const resp = await fetch('/push_ota', { method: 'POST', body: formData });
                const data = await resp.json();
                if (data.success) {
                    log('OTA 推送成功', 'success');
                } else {
                    log('OTA 推送失败: ' + data.error, 'error');
                }
            } catch (err) {
                log('请求失败: ' + err.message, 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = '推送 OTA';
            }
        };

        loadAliases();
    </script>
</body>

</html>
