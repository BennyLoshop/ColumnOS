<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>OTA 推送</title>
    <style>
        body {
            font-family: sans-serif;
            background: #1e1e1e;
            color: #ddd;
            margin: 0;
            padding: 0;
        }

        h2 {
            color: #4285f4;
        }

        .container {
            padding: 20px;
            max-width: 800px;
            margin: auto;
        }

        input,
        select,
        button {
            padding: 6px;
            margin: 2px;
            border-radius: 4px;
            border: none;
        }

        button {
            background: #4285f4;
            color: #fff;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        select {
            width: 100%;
            height: 100px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>发布 OTA 更新</h2>
        <form id="ota-form" enctype="multipart/form-data">
            <input type="file" name="file" id="ota-file" required>
            <select id="alias-select" multiple></select>
            <button type="submit">推送 OTA</button>
        </form>
        <div id="log"></div>
    </div>

    <script>
        function log(msg) { document.getElementById('log').innerHTML += msg + "<br>"; }

        async function loadAliases() {
            const resp = await fetch('/users');
            const data = await resp.json();
            const select = document.getElementById('alias-select');
            select.innerHTML = "";
            data.forEach(u => {
                const opt = document.createElement('option');
                opt.value = u.alias;
                opt.textContent = u.alias;
                select.appendChild(opt);
            });
        }

        document.getElementById('ota-form').onsubmit = async e => {
            e.preventDefault();
            const fileInput = document.getElementById('ota-file');
            const select = document.getElementById('alias-select');
            const aliases = Array.from(select.selectedOptions).map(o => o.value);
            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            aliases.forEach(a => formData.append('alias', a));
            const resp = await fetch('/push_ota', { method: 'POST', body: formData });
            const data = await resp.json();
            log(data.success ? 'OTA推送成功' : '失败: ' + data.error);
        };

        loadAliases();
    </script>
</body>

</html>
